<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="client" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
    <linearGradient id="gateway" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbc04"/>
      <stop offset="100%" stop-color="#c98a02"/>
    </linearGradient>
    <linearGradient id="backend" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34a853"/>
      <stop offset="100%" stop-color="#1e7a37"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#a11d1a"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ab47bc"/>
      <stop offset="100%" stop-color="#6a1b7a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="1300" height="900" fill="url(#bg)"/>

  <!-- Title -->
  <text x="650" y="42" text-anchor="middle" fill="#e6edf3" font-size="28" font-weight="700">🚔 KRIME AI — System Architecture</text>
  <text x="650" y="66" text-anchor="middle" fill="#8b949e" font-size="14">Datathon 2026 · Challenge 1 · Zoho Catalyst</text>

  <!-- User -->
  <g filter="url(#shadow)">
    <rect x="540" y="90" width="220" height="60" rx="14" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  </g>
  <text x="650" y="115" text-anchor="middle" font-size="26">👮</text>
  <text x="650" y="138" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">Investigator / Analyst</text>
  <text x="650" y="152" text-anchor="middle" fill="#8b949e" font-size="10">Admin · SP · Inspector · Analyst</text>

  <!-- ══════════ FRONTEND LAYER ══════════ -->
  <g filter="url(#shadow)">
    <rect x="60" y="185" width="1180" height="150" rx="16" fill="#12203a" stroke="#1a73e8" stroke-width="1.5" opacity="0.9"/>
  </g>
  <text x="90" y="212" fill="#5aa3ff" font-size="15" font-weight="700">🖥️  FRONTEND LAYER</text>

  <!-- Login card -->
  <g filter="url(#shadow)">
    <rect x="90" y="228" width="190" height="88" rx="12" fill="url(#client)"/>
  </g>
  <text x="185" y="256" text-anchor="middle" font-size="22">🔐</text>
  <text x="185" y="278" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Secure Login</text>
  <text x="185" y="293" text-anchor="middle" fill="#dbe7ff" font-size="10">Session token</text>
  <text x="185" y="306" text-anchor="middle" fill="#dbe7ff" font-size="10">stored in sessionStorage</text>

  <!-- Web Client card -->
  <g filter="url(#shadow)">
    <rect x="305" y="228" width="230" height="88" rx="12" fill="url(#client)"/>
  </g>
  <text x="420" y="256" text-anchor="middle" font-size="22">🌐</text>
  <text x="420" y="278" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Catalyst Web Client</text>
  <text x="420" y="293" text-anchor="middle" fill="#dbe7ff" font-size="10">public/ ↔ client/</text>
  <text x="420" y="306" text-anchor="middle" fill="#dbe7ff" font-size="10">HTML · CSS · Vanilla JS</text>

  <!-- Slate card -->
  <g filter="url(#shadow)">
    <rect x="560" y="228" width="190" height="88" rx="12" fill="url(#client)"/>
  </g>
  <text x="655" y="256" text-anchor="middle" font-size="22">🪶</text>
  <text x="655" y="278" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Catalyst Slate</text>
  <text x="655" y="293" text-anchor="middle" fill="#dbe7ff" font-size="10">krime-ai-slate</text>
  <text x="655" y="306" text-anchor="middle" fill="#dbe7ff" font-size="10">Static CDN hosting</text>

  <!-- Libs card -->
  <g filter="url(#shadow)">
    <rect x="775" y="228" width="220" height="88" rx="12" fill="url(#client)"/>
  </g>
  <text x="885" y="252" text-anchor="middle" font-size="20">📊 🕸️ 📄 🎤</text>
  <text x="885" y="278" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">UI Libraries</text>
  <text x="885" y="293" text-anchor="middle" fill="#dbe7ff" font-size="10">Chart.js · vis-network · jsPDF</text>
  <text x="885" y="306" text-anchor="middle" fill="#dbe7ff" font-size="10">Marked.js · Web Speech (STT/TTS)</text>

  <!-- Role gating badge -->
  <g filter="url(#shadow)">
    <rect x="1015" y="228" width="205" height="88" rx="12" fill="#1c2f4d" stroke="#5aa3ff" stroke-width="1.5"/>
  </g>
  <text x="1117" y="256" text-anchor="middle" font-size="20">🛡️</text>
  <text x="1117" y="278" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">Role-based UI Gating</text>
  <text x="1117" y="293" text-anchor="middle" fill="#8b949e" font-size="10">data-roles="Admin,SP,..."</text>
  <text x="1117" y="306" text-anchor="middle" fill="#8b949e" font-size="10">applyRoleGating()</text>

  <!-- ══════════ CATALYST PLATFORM (Gateway) ══════════ -->
  <g filter="url(#shadow)">
    <rect x="60" y="360" width="1180" height="90" rx="16" fill="#2a2410" stroke="#fbbc04" stroke-width="1.5" opacity="0.9"/>
  </g>
  <text x="90" y="387" fill="#ffd75e" font-size="15" font-weight="700">☁️  ZOHO CATALYST PLATFORM</text>
  <g filter="url(#shadow)">
    <rect x="440" y="393" width="420" height="46" rx="10" fill="url(#gateway)"/>
  </g>
  <text x="460" y="422" font-size="18">⚡</text>
  <text x="650" y="422" text-anchor="middle" fill="#221900" font-size="13" font-weight="700">Serverless Function · crime-chat-function</text>
  <text x="650" y="435" text-anchor="middle" fill="#3a2c00" font-size="9">Advanced I/O · Flask · Python 3.11 · X-Auth-Token header</text>

  <!-- ══════════ BACKEND LOGIC ══════════ -->
  <g filter="url(#shadow)">
    <rect x="60" y="480" width="1180" height="150" rx="16" fill="#0f2a17" stroke="#34a853" stroke-width="1.5" opacity="0.9"/>
  </g>
  <text x="90" y="507" fill="#5fd685" font-size="15" font-weight="700">⚙️  BACKEND LOGIC</text>

  <g filter="url(#shadow)">
    <rect x="90" y="523" width="255" height="88" rx="12" fill="url(#backend)"/>
  </g>
  <text x="217" y="551" text-anchor="middle" font-size="22">📋</text>
  <text x="217" y="573" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">index.py</text>
  <text x="217" y="588" text-anchor="middle" fill="#e2ffe9" font-size="10">API routes · CORS</text>
  <text x="217" y="601" text-anchor="middle" fill="#e2ffe9" font-size="10">Session context · Audit log</text>

  <g filter="url(#shadow)">
    <rect x="370" y="523" width="255" height="88" rx="12" fill="url(#backend)"/>
  </g>
  <text x="497" y="551" text-anchor="middle" font-size="22">🔑</text>
  <text x="497" y="573" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">auth.py</text>
  <text x="497" y="588" text-anchor="middle" fill="#e2ffe9" font-size="10">Users · Sessions</text>
  <text x="497" y="601" text-anchor="middle" fill="#e2ffe9" font-size="10">require_role() decorator</text>

  <g filter="url(#shadow)">
    <rect x="650" y="523" width="290" height="88" rx="12" fill="url(#backend)"/>
  </g>
  <text x="795" y="551" text-anchor="middle" font-size="22">🧩</text>
  <text x="795" y="573" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">ai_engine.py</text>
  <text x="795" y="588" text-anchor="middle" fill="#e2ffe9" font-size="10">NL→SQL · Intent detection · Kannada</text>
  <text x="795" y="601" text-anchor="middle" fill="#e2ffe9" font-size="10">translation · Response generation</text>

  <g filter="url(#shadow)">
    <rect x="965" y="523" width="255" height="88" rx="12" fill="url(#backend)"/>
  </g>
  <text x="1092" y="551" text-anchor="middle" font-size="22">🌱</text>
  <text x="1092" y="573" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">synthetic_data.py</text>
  <text x="1092" y="588" text-anchor="middle" fill="#e2ffe9" font-size="10">DB schema + seed</text>
  <text x="1092" y="601" text-anchor="middle" fill="#e2ffe9" font-size="10">1500 synthetic FIR cases</text>

  <!-- ══════════ DATA LAYER + AI SERVICES (side by side) ══════════ -->
  <g filter="url(#shadow)">
    <rect x="60" y="660" width="560" height="200" rx="16" fill="#2a1010" stroke="#e53935" stroke-width="1.5" opacity="0.9"/>
  </g>
  <text x="90" y="687" fill="#ff8a80" font-size="15" font-weight="700">🗄️  DATA LAYER</text>

  <g filter="url(#shadow)">
    <rect x="90" y="703" width="255" height="130" rx="12" fill="url(#data)"/>
  </g>
  <text x="217" y="732" text-anchor="middle" font-size="24">🗃️</text>
  <text x="217" y="756" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">SQLite · ksp_crime.db</text>
  <text x="217" y="772" text-anchor="middle" fill="#ffe0de" font-size="9">districts · stations · fir_cases</text>
  <text x="217" y="785" text-anchor="middle" fill="#ffe0de" font-size="9">accused · victims · officers</text>
  <text x="217" y="798" text-anchor="middle" fill="#ffe0de" font-size="9">users · sessions · audit_log</text>
  <text x="217" y="811" text-anchor="middle" fill="#ffe0de" font-size="9">session_context · stolen_property</text>

  <g filter="url(#shadow)">
    <rect x="370" y="703" width="220" height="130" rx="12" fill="url(#data)"/>
  </g>
  <text x="480" y="732" text-anchor="middle" font-size="24">📚</text>
  <text x="480" y="756" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">docs/</text>
  <text x="480" y="772" text-anchor="middle" fill="#ffe0de" font-size="9">KSP SOP Investigation</text>
  <text x="480" y="785" text-anchor="middle" fill="#ffe0de" font-size="9">Manual (.txt)</text>
  <text x="480" y="800" text-anchor="middle" fill="#ffe0de" font-size="9">station_crime_stats.csv</text>

  <g filter="url(#shadow)">
    <rect x="660" y="660" width="580" height="200" rx="16" fill="#241028" stroke="#ab47bc" stroke-width="1.5" opacity="0.9"/>
  </g>
  <text x="690" y="687" fill="#e0a3ee" font-size="15" font-weight="700">🧠  CATALYST QUICKML — AI SERVICES</text>

  <g filter="url(#shadow)">
    <rect x="690" y="703" width="170" height="130" rx="12" fill="url(#ai)"/>
  </g>
  <text x="775" y="734" text-anchor="middle" font-size="24">💬</text>
  <text x="775" y="760" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">GLM-4.7-Flash</text>
  <text x="775" y="778" text-anchor="middle" fill="#f2dcff" font-size="9">NL insight</text>
  <text x="775" y="791" text-anchor="middle" fill="#f2dcff" font-size="9">generation</text>

  <g filter="url(#shadow)">
    <rect x="875" y="703" width="170" height="130" rx="12" fill="url(#ai)"/>
  </g>
  <text x="960" y="734" text-anchor="middle" font-size="24">🔍</text>
  <text x="960" y="760" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">RAG Engine</text>
  <text x="960" y="778" text-anchor="middle" fill="#f2dcff" font-size="9">Document Q&amp;A over</text>
  <text x="960" y="791" text-anchor="middle" fill="#f2dcff" font-size="9">SOP Knowledge Base</text>

  <g filter="url(#shadow)">
    <rect x="1060" y="703" width="170" height="130" rx="12" fill="url(#ai)"/>
  </g>
  <text x="1145" y="734" text-anchor="middle" font-size="24">🚨</text>
  <text x="1145" y="760" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">AutoML Pipeline</text>
  <text x="1145" y="778" text-anchor="middle" fill="#f2dcff" font-size="9">Anomaly / hotspot</text>
  <text x="1145" y="791" text-anchor="middle" fill="#f2dcff" font-size="9">classification model</text>

  <!-- ═══ ARROWS ═══ -->
  <!-- User -> Login -->
  <path d="M620,150 C560,165 400,180 300,225" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- Login/WebClient -> Gateway -->
  <path d="M420,316 C420,340 500,352 650,390" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="470" y="345" fill="#8b949e" font-size="9">fetch() /api/* + X-Auth-Token</text>
  <!-- Gateway -> Backend -->
  <path d="M650,439 C650,455 650,465 650,520" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- Backend (index.py) -> Data -->
  <path d="M217,611 C217,635 217,650 217,700" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- ai_engine -> Data (SQL) -->
  <path d="M760,611 C660,635 500,655 345,700" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="560" y="650" fill="#8b949e" font-size="9">SQL queries</text>
  <!-- ai_engine -> QuickML -->
  <path d="M850,611 C880,635 900,655 900,700" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="905" y="650" fill="#8b949e" font-size="9">OAuth + HTTPS</text>
  <!-- synthetic_data -> Data (seed) -->
  <path d="M1050,611 C900,650 700,670 450,703" fill="none" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="820" y="670" fill="#8b949e" font-size="9">seeds</text>
  <!-- RAG -> Docs -->
  <path d="M875,780 C700,790 600,790 545,780" fill="none" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <g transform="translate(60,860)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="36" y="4" fill="#8b949e" font-size="10">Request / data flow</text>
    <line x1="220" y1="0" x2="250" y2="0" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="256" y="4" fill="#8b949e" font-size="10">Seed / index (offline)</text>
  </g>
</svg>
